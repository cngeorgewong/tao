<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青云 · 太虚境</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;700&display=swap" rel="stylesheet">

    <style>
        /* 这里保留 V34.0 的所有样式，内容过长，此处省略，请在实际操作时保留原样 */
        :root { --void-bg: #f7f7f5; --ink-deep: #0a0a0a; --ink-light: #666; --cinnabar: #c23838; --gold: #bfa46f; --font-art: 'Ma Shan Zheng', cursive; --font-body: 'Noto Serif SC', serif; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; background: var(--void-bg); overflow: hidden; height: 100%; cursor: none; }
        .ambient-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, #f0f0eb 100%); }
        .noise { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.03; pointer-events: none; background: url('https://www.transparenttextures.com/patterns/stardust.png'); }
        .fog { position: absolute; border-radius: 50%; background: #fff; filter: blur(60px); opacity: 0.6; animation: breathe 10s infinite ease-in-out; }
        @keyframes breathe { 0%,100% {transform: scale(1); opacity:0.5;} 50% {transform: scale(1.1); opacity:0.7;} }
        @media (pointer: fine) {
            .cursor-dot { position: fixed; width: 8px; height: 8px; background: var(--ink-deep); border-radius: 50%; pointer-events: none; z-index: 9999; transition: transform 0.1s; }
            .cursor-aura { position: fixed; width: 40px; height: 40px; border: 1px solid rgba(0,0,0,0.1); border-radius: 50%; pointer-events: none; z-index: 9998; transition: transform 0.2s, opacity 0.2s; }
        }
        .main-scroll { height: 100vh; overflow-y: auto; scroll-snap-type: y mandatory; position: relative; z-index: 10; scrollbar-width: none; }
        .main-scroll::-webkit-scrollbar { display: none; }
        .section { height: 100vh; width: 100%; scroll-snap-align: center; display: flex; justify-content: center; align-items: center; position: relative; }
        .hero-text { writing-mode: vertical-rl; font-family: var(--font-art); font-size: 8vh; letter-spacing: 0.2em; color: var(--ink-deep); position: relative; cursor: pointer; z-index: 20; transition: 0.5s; }
        .hero-text:hover { color: var(--cinnabar); transform: scale(1.05); }
        .fate-mark { position: absolute; top: 22%; left: 55%; writing-mode: vertical-rl; font-family: var(--font-body); font-size: 0.8rem; letter-spacing: 0.3em; color: var(--ink-light); border-top: 2px solid var(--cinnabar); padding-top: 10px; opacity: 0; }
        .bg-seal { position: absolute; width: 40vh; height: 40vh; opacity: 0.04; z-index: 1; pointer-events: none; fill: var(--ink-deep); mix-blend-mode: multiply; }
        .void-realm { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; clip-path: inset(0 0 100% 0); transition: clip-path 1s cubic-bezier(0.77, 0, 0.175, 1); }
        .void-realm.active { clip-path: inset(0 0 0 0); }
        .infinite-track { display: flex; height: 100%; width: 100%; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; cursor: grab; background: linear-gradient(90deg, #fff 0%, #fdfbf6 100%); }
        .infinite-track:active { cursor: grabbing; }
        .content-card { flex-shrink: 0; height: 100%; min-width: 50vw; display: flex; align-items: center; writing-mode: vertical-rl; padding: 0 4vw; box-sizing: border-box; border-right: 1px dashed rgba(0,0,0,0.03); position: relative; }
        .article-title { font-family: var(--font-art); font-size: 3rem; margin-left: 30px; border-left: 3px solid var(--cinnabar); padding-left: 15px; color: #222; }
        .article-body { font-family: var(--font-body); font-size: 1.15rem; line-height: 2.2; color: #444; text-align: justify; height: 60vh; column-fill: auto; margin-left: 30px; white-space: pre-wrap; }
        .gallery-frame { max-height: 55vh; max-width: 70vw; width: auto; box-shadow: 10px 10px 40px rgba(0,0,0,0.08); border: 8px solid #fff; outline: 1px solid #eee; margin: 0 30px; transition: transform 0.5s; object-fit: contain; background: #000; }
        .logic-node { border: 1px solid var(--gold); background: rgba(191, 164, 111, 0.05); padding: 40px 20px; margin: 0 40px; position: relative; }
        .logic-node::before { content: '◈'; position: absolute; top: -10px; right: 50%; transform: translateX(50%); color: var(--gold); background: #fff; padding: 0 5px; }
        .logic-formula { font-family: 'Courier New', monospace; font-size: 1.1rem; color: var(--ink-deep); margin-left: 10px; font-weight: bold; }
        .spirit-dot { position: fixed; bottom: 40px; left: 40px; width: 14px; height: 14px; background: var(--cinnabar); border-radius: 50%; z-index: 3000; cursor: pointer; box-shadow: 0 0 0 0 rgba(194, 56, 56, 0.7); animation: pulse 3s infinite; transition: 0.3s; }
        .energy-ring { position: fixed; top: 40px; right: 40px; width: 40px; height: 40px; border: 1px solid rgba(0,0,0,0.1); border-radius: 50%; z-index: 3000; display: flex; align-items: center; justify-content: center; }
        .energy-core { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; box-shadow: 0 0 15px var(--gold); transition: 0.5s; }
        .gatekeeper-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 6000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.5s; }
        .gatekeeper-modal.active { opacity: 1; pointer-events: auto; }
        .gate-input { border: none; border-bottom: 2px solid var(--ink-deep); font-size: 2rem; width: 200px; text-align: center; background: transparent; outline: none; margin-top: 20px; font-family: var(--font-art); }
        .admin-glass { position: fixed; bottom: 0; left: 0; width: 100%; height: 0; background: rgba(255,255,255,0.98); z-index: 5000; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1); overflow: hidden; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 50px rgba(0,0,0,0.1); }
        .admin-glass.open { height: 85vh; }
        .form-wrap { padding: 30px; max-width: 600px; margin: 0 auto; font-family: var(--font-body); overflow-y: auto; height: 100%; }
        .minimal-input { width: 100%; border: none; border-bottom: 1px solid #ddd; background: transparent; padding: 15px 0; font-size: 16px; margin-bottom: 25px; outline: none; border-radius: 0; }
        .minimal-btn { background: var(--ink-deep); color: #fff; border: none; padding: 15px 40px; cursor: pointer; border-radius: 4px; font-family: inherit; margin-right: 10px; width: 100%; margin-bottom: 10px; font-size: 1rem; }
        .minimal-btn.secondary { background: #eee; color: #333; }
        .close-realm { position: fixed; top: 30px; right: 30px; font-size: 2rem; color: #ccc; cursor: pointer; z-index: 2001; opacity: 0; pointer-events: none; transition: 0.3s; }
        .void-realm.active .close-realm { opacity: 1; pointer-events: auto; }
        @media screen and (max-width: 768px) { .content-card { min-width: 85vw; padding: 0 20px; } .article-title { font-size: 2.2rem; } .cursor-dot, .cursor-aura { display: none !important; } .gallery-frame { max-width: 85vw; } }
    </style>
</head>
<body>
    <div class="ambient-layer"><div class="fog" style="top:30%; left:20%; width:400px; height:400px;"></div></div>
    <div class="noise"></div>
    <div class="cursor-dot" id="cDot"></div><div class="cursor-aura" id="cAura"></div>

    <div class="spirit-dot" onclick="checkPermission()"></div>
    <div class="energy-ring"><div class="energy-core" id="auraCore"></div></div>

    <div class="gatekeeper-modal" id="gateModal">
        <div style="text-align:center; font-family:var(--font-body);">
            <h2 style="font-weight:normal; letter-spacing:5px; margin:0;">太虚禁地</h2>
            <input type="password" id="gatePass" class="gate-input" placeholder="口令">
            <button onclick="verifyPass()" class="minimal-btn" style="margin-top:30px; width:auto; padding:10px 30px;">入阵</button>
            <div onclick="closeGate()" style="margin-top:20px; cursor:pointer; color:#999; font-size:0.8rem;">离去</div>
        </div>
    </div>

    <div class="admin-glass" id="adminPanel">
        <div class="form-wrap">
            <h2 style="font-family:var(--font-art); color:var(--cinnabar); margin-top:0;">云端受箓</h2>
            <select id="pTarget" class="minimal-input">
                <option value="wangwu">其一：王屋洞天</option>
                <option value="weiyu">其二：委羽山洞</option>
                <option value="chisong">其三：赤松遗风</option>
            </select>
            <select id="pType" class="minimal-input" onchange="toggleFields()">
                <option value="article">体裁：文章 (纯文字)</option>
                <option value="image">体裁：图文 (图片)</option>
                <option value="video">体裁：留影 (视频)</option>
                <option value="logic">体裁：阵法 (逻辑)</option>
            </select>
            <input id="pTitle" class="minimal-input" placeholder="标题 / Title">
            <input id="pMedia" class="minimal-input" placeholder="媒体链接 (URL)">
            <textarea id="pBody" class="minimal-input" rows="4" placeholder="正文 / 逻辑公式"></textarea>
            
            <button class="minimal-btn" onclick="publish()">同步至云端</button>
            <div style="margin-top:20px; text-align:center; color:#999; cursor:pointer; padding-bottom:50px;" onclick="toggleAdmin()">关闭面板</div>
        </div>
    </div>

    <div class="void-realm" id="voidRealm">
        <div class="close-realm" onclick="closeRealm()">✕</div>
        <div class="infinite-track" id="infiniteTrack"></div>
    </div>

    <div class="main-scroll">
        <section class="section">
            <svg class="bg-seal" viewBox="0 0 100 100"><rect x="20" y="20" width="60" height="60" transform="rotate(45 50 50)" /></svg>
            <div class="hero-text" onclick="enterRealm('wangwu')">王屋洞天</div>
            <div class="fate-mark" id="f1"></div>
        </section>
        <section class="section">
            <svg class="bg-seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" /></svg>
            <div class="hero-text" onclick="enterRealm('weiyu')">委羽山洞</div>
            <div class="fate-mark" id="f2"></div>
        </section>
        <section class="section">
            <svg class="bg-seal" viewBox="0 0 100 100"><path d="M10,90 L50,10 L90,90 Z" /></svg>
            <div class="hero-text" onclick="enterRealm('chisong')">赤松遗风</div>
            <div class="fate-mark" id="f3"></div>
        </section>
    </div>

    <script>
        // --- 核心：云端配置 ---
        // ！！！请在这里填入你的 Supabase 信息 ！！！
        const SUPABASE_URL = 'https://mctqfattznybghuobqum.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jdHFmYXR0em55YmdodW9icXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NjUwMDQsImV4cCI6MjA4NzM0MTAwNH0.ma30ugPfjQWmQUELCOiRxc0bI_w0ky-yGykhrzIdefQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        gsap.registerPlugin(ScrollTrigger);
        let isAdmin = sessionStorage.getItem('is_dao_admin') === 'true';

        async function enterRealm(id) {
            const track = document.getElementById('infiniteTrack');
            track.innerHTML = '<div class="content-card">正在从经变图中取经...</div>';
            
            document.getElementById('voidRealm').classList.add('active');

            // 从云端获取数据
            const { data, error } = await _supabase
                .from('posts')
                .select('*')
                .eq('target', id)
                .order('created_at', { ascending: true });

            if (error) {
                track.innerHTML = '<div class="content-card">天机受阻，无法读取。</div>';
                return;
            }

            track.innerHTML = '';
            track.onwheel = (e) => { if(e.deltaY!==0){e.preventDefault(); track.scrollLeft+=e.deltaY;} };

            data.forEach(item => {
                let inner = '';
                if (item.type === 'logic') inner = `<div class="logic-node"><div class="logic-formula">${item.body}</div></div>`;
                else if (item.type === 'video') inner = `<video src="${item.media}" controls class="gallery-frame" playsinline></video><div class="article-body">${item.body}</div>`;
                else if (item.type === 'image') inner = `<img src="${item.media}" class="gallery-frame"><div class="article-body">${item.body}</div>`;
                else inner = `<div class="article-body">${item.body}</div>`;

                track.innerHTML += `<div class="content-card"><h2 class="article-title">${item.title}</h2>${inner}</div>`;
            });

            const date = new Date().toLocaleDateString('zh-CN-u-ca-chinese');
            track.innerHTML += `<div class="content-card" style="justify-content:center; min-width:40vw;"><div style="font-family:var(--font-body); color:#999; letter-spacing:2px;">${date}<br>青云道人<br><div style="width:40px; height:40px; border:1px solid #ccc; margin-top:20px; line-height:40px; text-align:center;">印</div></div></div>`;

            gsap.fromTo(".content-card", { x: 50, opacity: 0 }, { x: 0, opacity: 1, duration: 0.8, stagger: 0.15, delay: 0.1 });
        }

        async function publish() {
            const t = document.getElementById('pTarget').value;
            const title = document.getElementById('pTitle').value;
            if(!title) return alert("标题不可为空");
            
            // 同步至云端
            const { error } = await _supabase
                .from('posts')
                .insert([{
                    target: t,
                    type: document.getElementById('pType').value,
                    title: title,
                    body: document.getElementById('pBody').value || ' ',
                    media: document.getElementById('pMedia').value
                }]);

            if (error) {
                alert("发布失败：" + error.message);
            } else {
                const core = document.getElementById('auraCore');
                gsap.to(core, { scale: 3, boxShadow: "0 0 30px var(--cinnabar)", backgroundColor: "var(--cinnabar)", duration: 0.5, yoyo: true, repeat: 1 });
                alert("已同步至经变图");
                toggleAdmin();
                document.getElementById('pTitle').value = ""; document.getElementById('pBody').value = ""; document.getElementById('pMedia').value = "";
            }
        }

        // --- 保持原有基础逻辑 ---
        function checkPermission() { isAdmin ? toggleAdmin() : document.getElementById('gateModal').classList.add('active'); }
        function verifyPass() { if(document.getElementById('gatePass').value === 'tao') { isAdmin = true; sessionStorage.setItem('is_dao_admin', 'true'); closeGate(); toggleAdmin(); } else alert("口令错误"); }
        function closeGate() { document.getElementById('gateModal').classList.remove('active'); }
        function toggleAdmin() { document.getElementById('adminPanel').classList.toggle('open'); }
        function closeRealm() { document.getElementById('voidRealm').classList.remove('active'); }
        function toggleFields() { const t = document.getElementById('pType').value; const m = document.getElementById('pMedia'); m.style.display = (t === 'image' || t === 'video') ? 'block' : 'none'; }

        window.onload = () => {
            const d = "丙午年 · 正月";
            document.getElementById('f1').innerText = `${d} · 宜静思`;
            document.getElementById('f2').innerText = `${d} · 宜研习`;
            document.getElementById('f3').innerText = `${d} · 宜修行`;
            gsap.to('.fate-mark', { opacity: 1, y: 0, duration: 1.5, stagger: 0.3, delay: 0.5 });
            toggleFields();
        };

        const dot = document.getElementById('cDot'); const aura = document.getElementById('cAura');
        if(window.matchMedia("(pointer: fine)").matches) { window.addEventListener('mousemove', (e) => { gsap.to(dot, {x: e.clientX, y: e.clientY, duration: 0.1}); gsap.to(aura, {x: e.clientX, y: e.clientY, duration: 0.4}); }); }
    </script>
</body>
</html>
