<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>青云 · 太虚境</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --void-bg: #f5f5f2; --ink: #0a0a0a; --cinnabar: #c23838; --gold: #bfa46f;
            --font-art: 'Ma Shan Zheng', 'STKaiti', cursive;
            --font-body: 'Noto Serif SC', 'Songti SC', serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; background: var(--void-bg); height: 100%; width: 100%; overflow: hidden; font-family: var(--font-body); }

        /* 气韵层 (纯净背景呼吸) */
        .ambient-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; background: radial-gradient(circle at 50% 50%, #fff 0%, #f0f0eb 100%); }
        .fog { position: absolute; border-radius: 50%; background: #fff; filter: blur(60px); opacity: 0.5; animation: breathe 10s infinite ease-in-out; }
        @keyframes breathe { 0%,100% {transform: scale(1); opacity:0.4;} 50% {transform: scale(1.15); opacity:0.6;} }

        /* 首页排版与纯 CSS 丝滑交互 */
        .main-scroll { height: 100vh; width: 100%; overflow-y: scroll; scroll-snap-type: y mandatory; position: relative; z-index: 10; }
        .main-scroll::-webkit-scrollbar { display: none; }
        .section { height: 100vh; width: 100%; scroll-snap-align: center; display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; }
        .hero-wrap { position: relative; display: flex; align-items: center; justify-content: center; transform: translateX(-20px); }

        .hero-text { writing-mode: vertical-rl; font-family: var(--font-art); font-size: 4.2rem; font-weight: 400; letter-spacing: 0.25em; color: var(--ink); transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1); z-index: 20; margin: 0; text-shadow: 1px 1px 5px rgba(0,0,0,0.03); }
        .bg-seal { position: absolute; width: 45vw; height: 45vw; max-width: 350px; max-height: 350px; opacity: 0.03; z-index: 1; fill: var(--ink); mix-blend-mode: multiply; pointer-events: none; transition: all 0.8s cubic-bezier(0.19, 1, 0.22, 1); }

        @media (pointer: fine) {
            .section:hover .bg-seal { transform: scale(1.15) rotate(5deg); opacity: 0.08; }
            .section:hover .hero-text { color: var(--cinnabar); transform: translateY(-10px); }
        }
        .section:active .hero-text { transform: scale(0.95); color: var(--cinnabar); } 
        .fate-mark { position: absolute; right: -40px; writing-mode: vertical-rl; font-family: var(--font-body); font-size: 0.85rem; font-weight: 700; color: #666; border-top: 1.5px solid var(--cinnabar); padding-top: 15px; letter-spacing: 0.2em; opacity: 0; pointer-events: none; white-space: nowrap; }

        /* 结界长卷 */
        .void-realm { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #fff; z-index: 1000; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.2, 0, 0, 1); display: flex; flex-direction: column; }
        .void-realm.active { transform: translateY(0); }
        .realm-bar { height: 60px; width: 100%; display: flex; justify-content: flex-end; align-items: center; padding-right: 20px; z-index: 2000; background: linear-gradient(to bottom, #fff, rgba(255,255,255,0)); }
        .close-btn { font-size: 1.5rem; color: #999; cursor: pointer; padding: 10px; transition: 0.3s; }
        .close-btn:hover { color: var(--cinnabar); }
        
        .infinite-track { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; padding-left: 5vw; background: linear-gradient(90deg, #fff 0%, #fcfcf9 100%); }
        .content-card { height: 100%; width: max-content; display: flex; align-items: center; justify-content: flex-start; writing-mode: vertical-rl; padding: 30px 20px; border-right: 1px dashed #ddd; flex-shrink: 0; }

        .article-title { font-family: var(--font-body); font-size: 2.2rem; font-weight: 900; margin-left: 20px; border-left: 4px solid var(--cinnabar); padding-left: 15px; color: #222; }
        .article-body { display: block; font-family: var(--font-body); font-size: 1.1rem; line-height: 2.2; color: #333; height: 75vh; text-align: justify; margin-left: 20px; margin-right: 15px; column-fill: auto; }
        
        .article-body p { margin-left: 1.5rem; text-orientation: upright; letter-spacing: 0.02em; word-break: break-all; }
        .article-body strong { font-weight: 900; color: #000; }
        .article-body blockquote { border-top: 3px solid var(--gold); padding-top: 15px; margin-left: 1.5rem; color: #777; }
        .article-body img, .article-body video { max-height: 50vh; max-width: 70vw; box-shadow: 5px 5px 15px rgba(0,0,0,0.08); border: 4px solid #fff; outline: 1px solid #eee; margin: 0 1.5rem; background: #000; object-fit: contain; display: inline-block; }

        .num-group { text-combine-upright: all; -webkit-text-combine-upright: all; font-family: sans-serif; }
        .colophon-box { font-size: 0.85rem; color: #888; margin-left: 20px; border-right: 1px solid #eee; padding-right: 15px; height: 60%; text-orientation: upright; }

        /* 后台 UI */
        .spirit-dot { position: fixed; bottom: 30px; left: 30px; width: 12px; height: 12px; background: var(--cinnabar); border-radius: 50%; z-index: 5000; box-shadow: 0 0 0 4px rgba(194,56,56,0.1); cursor: pointer; transition: 0.3s; }
        .spirit-dot:hover { transform: scale(1.5); }
        .admin-panel { position: fixed; bottom: 0; left: 0; width: 100%; height: 0; background: #fff; z-index: 6000; transition: 0.4s; border-radius: 20px 20px 0 0; overflow: hidden; box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .admin-panel.open { height: 90vh; }
        .form-content { padding: 30px; overflow-y: auto; height: 100%; }
        input, select, textarea { width: 100%; border: none; border-bottom: 1px solid #ccc; padding: 15px 0; margin-bottom: 20px; font-size: 16px; background: transparent; outline: none; border-radius: 0; font-family: var(--font-body); }
        .submit-btn { width: 100%; padding: 15px; background: var(--ink); color: #fff; border: none; font-size: 16px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 15px;}
        .toolbar { display: flex; gap: 10px; margin-bottom: 10px; }
        .tool-btn { flex: 1; padding: 10px; background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; color: #333; font-size: 0.9rem; transition: 0.2s; }
        
        /* 晨省模块 */
        .morning-trigger { position: fixed; top: 30px; left: 30px; z-index: 4000; writing-mode: vertical-rl; font-weight: 700; font-size: 0.9rem; color: var(--ink); letter-spacing: 0.3em; cursor: pointer; opacity: 0.6; border-right: 2px solid var(--gold); padding-right: 8px; transition: 0.3s; }
        .morning-trigger:hover { opacity: 1; color: var(--cinnabar); }
        .morning-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(245, 245, 242, 0.98); z-index: 6500; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.5s; }
        .morning-panel.active { opacity: 1; pointer-events: auto; }
        .sleep-options { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .sleep-btn { flex: 1; margin: 0 5px; background: transparent; border: 1px solid #ccc; color: #666; font-weight: normal; border-radius: 30px; padding: 10px 0; transition: 0.3s; cursor: pointer; }
        .sleep-btn.selected { background: var(--gold); color: #fff; border-color: var(--gold); }

        /* 手机端双生排版（瀑布流） */
        @media screen and (max-width: 768px) {
            .hero-text { font-size: 3.8rem; }
            .hero-wrap { transform: translateX(-15px); }
            .fate-mark { right: -32px; font-size: 0.75rem; }
            .realm-bar { position: sticky; top: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); box-shadow: 0 1px 10px rgba(0,0,0,0.05); }
            .infinite-track { flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 0 20px 50px 20px; }
            .content-card { width: 100%; height: auto; display: block; writing-mode: horizontal-tb; padding: 40px 0; border-right: none; border-bottom: 1px dashed #ddd; }
            .content-card:last-child { border-bottom: none; }
            .article-title { writing-mode: horizontal-tb; text-orientation: mixed; margin: 0 0 20px 0; border-left: 4px solid var(--cinnabar); padding-left: 15px; }
            .article-body { height: auto; writing-mode: horizontal-tb; margin: 0; padding: 0; }
            .article-body p, .article-body h1, .article-body h2, .article-body ul, .article-body ol { writing-mode: horizontal-tb; text-orientation: mixed; margin-left: 0; margin-bottom: 1rem; }
            .article-body blockquote { border-top: none; border-left: 3px solid var(--gold); padding-left: 15px; padding-top: 0; margin-left: 0; }
            .article-body img, .article-body video { max-width: 100%; width: 100%; height: auto; max-height: unset; margin: 20px 0; border-width: 2px; box-sizing: border-box; }
            .colophon-box { writing-mode: horizontal-tb; text-orientation: mixed; height: auto; margin: 20px 0 0 0; border-right: none; border-left: 2px solid #eee; padding-left: 15px; }
        }
    </style>
</head>
<body>

    <div class="morning-trigger" onclick="document.getElementById('morningPanel').classList.toggle('active')">晨省</div>
    <div class="morning-panel" id="morningPanel">
        <div style="width:85%; max-width:400px; text-align:center;">
            <h2 style="font-family:var(--font-art); font-size:2.5rem; color:var(--gold); margin-bottom:30px;">辰时初刻</h2>
            <div class="sleep-options">
                <button class="sleep-btn selected" onclick="selectSleep(this, '酣睡')">酣睡</button>
                <button class="sleep-btn" onclick="selectSleep(this, '浅梦')">浅梦</button>
                <button class="sleep-btn" onclick="selectSleep(this, '辗转')">辗转</button>
            </div>
            <textarea id="mSchedule" style="width:100%; border:1px solid #eee; background:#fff; border-radius:10px; padding:15px; height:120px; resize:none;" placeholder="写下今日日程或心境..."></textarea>
            <button class="submit-btn" style="background:var(--gold); margin-top:20px;" onclick="submitMorning()">存入经卷</button>
            <div style="color:#999; cursor:pointer; margin-top:10px;" onclick="document.getElementById('morningPanel').classList.remove('active')">退下</div>
        </div>
    </div>

    <div class="main-scroll">
        <section class="section" onclick="enterRealm('wangwu')">
            <svg class="bg-seal" viewBox="0 0 100 100"><rect x="25" y="25" width="50" height="50" transform="rotate(45 50 50)" /></svg>
            <div class="hero-wrap"><h1 class="hero-text">王屋洞天</h1><div class="fate-mark" id="fate-wangwu"></div></div>
        </section>
        <section class="section" onclick="enterRealm('weiyu')">
            <svg class="bg-seal" viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" /></svg>
            <div class="hero-wrap"><h1 class="hero-text">委羽山洞</h1><div class="fate-mark" id="fate-weiyu"></div></div>
        </section>
        <section class="section" onclick="enterRealm('chisong')">
            <svg class="bg-seal" viewBox="0 0 100 100"><path d="M50,20 L80,80 L20,80 Z" /></svg>
            <div class="hero-wrap"><h1 class="hero-text">赤松遗风</h1><div class="fate-mark" id="fate-chisong"></div></div>
        </section>
    </div>

    <div class="void-realm" id="voidRealm">
        <div class="realm-bar"><div class="close-btn" onclick="closeRealm()">✕ 归墟</div></div>
        <div class="infinite-track" id="infiniteTrack"></div>
    </div>

    <div class="spirit-dot" onclick="toggleAdmin()"></div>

    <div class="admin-panel" id="adminPanel">
        <div class="form-content">
            <h3 style="margin-top:0; color:var(--cinnabar); font-family:var(--font-art); font-size:2rem; font-weight:normal;">受箓发布</h3>
            <select id="pTarget">
                <option value="wangwu">王屋洞天</option>
                <option value="weiyu">委羽山洞</option>
                <option value="chisong">赤松遗风</option>
            </select>
            <input id="pTitle" placeholder="标题 / Title">
            <div class="toolbar">
                <button class="tool-btn" onclick="insertMedia('image')">🖼️ 添图</button>
                <button class="tool-btn" onclick="insertMedia('video')">🎬 添影</button>
            </div>
            <textarea id="pBody" rows="10" placeholder="在此书写 Markdown 正文..."></textarea>
            <input id="pColophon" placeholder="题跋批注 (可选)">
            <button class="submit-btn" onclick="publish()">发布至云端</button>
            <div style="text-align:center; color:#999; cursor:pointer;" onclick="toggleAdmin()">收起法简</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

    <script>
        // --- 核心配置 ---
        const SUPABASE_URL = 'https://mctqfattznybghuobqum.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jdHFmYXR0em55YmdodW9icXVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE3NjUwMDQsImV4cCI6MjA4NzM0MTAwNH0.ma30ugPfjQWmQUELCOiRxc0bI_w0ky-yGykhrzIdefQ';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        if (typeof marked !== 'undefined') { marked.setOptions({ breaks: true }); }

        function insertMedia(type) {
            const url = prompt(type === 'image' ? "请输入图片真实链接 (如 https://...jpg)" : "请输入视频真实链接 (如 https://...mp4)");
            if (!url) return;
            const textarea = document.getElementById('pBody');
            textarea.value += type === 'image' ? `\n\n![画卷](${url})\n\n` : `\n\n<video src="${url}" controls playsinline></video>\n\n`;
            textarea.focus();
        }

        let currentSleep = '酣睡';
        function selectSleep(btn, status) {
            document.querySelectorAll('.sleep-btn').forEach(el => el.classList.remove('selected'));
            btn.classList.add('selected'); currentSleep = status;
        }

        async function submitMorning() {
            // --- 晨省结界防护 ---
            if (!sessionStorage.getItem('dao_login')) {
                if (prompt("道场清修，请对暗号：") !== 'tao') {
                    return alert("机缘未到，无法留印。");
                }
                sessionStorage.setItem('dao_login', 'true');
            }
            // ------------------

            const scheduleText = document.getElementById('mSchedule').value;
            if(!scheduleText) return alert("请留片语");
            try {
                const { error } = await _supabase.from('posts').insert([{
                    target: 'chisong', type: 'mixed', title: `晨省`, body: `**眠境**：${currentSleep}\n\n**日程**：\n${scheduleText}`, colophon: new Date().toLocaleDateString('zh-CN-u-ca-chinese')
                }]);
                if (error) throw error;
                alert("晨省已记录。"); document.getElementById('morningPanel').classList.remove('active'); document.getElementById('mSchedule').value = "";
            } catch (err) { alert("失败：" + err.message); }
        }

        function generateFate() {
            const today = new Date();
            const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
            const stems = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
            const branches = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
            const lunarYear = `${stems[(today.getFullYear() - 4) % 10]}${branches[(today.getFullYear() - 4) % 12]}年`;

            const fateDict = {
                wangwu: { yi: ["静思", "赏画", "观云", "冥想"], ji: ["喧哗", "动怒"] },
                weiyu: { yi: ["推演", "读书", "破局", "复盘"], ji: ["盲从", "怠惰"] },
                chisong: { yi: ["修行", "造物", "漫步", "修身"], ji: ["熬夜", "争执"] }
            };

            ['wangwu', 'weiyu', 'chisong'].forEach(realm => {
                const yiWord = fateDict[realm].yi[seed % fateDict[realm].yi.length];
                const jiWord = fateDict[realm].ji[(seed * 2) % fateDict[realm].ji.length];
                document.getElementById(`fate-${realm}`).innerText = `${lunarYear} · 宜${yiWord} · 忌${jiWord}`;
            });

            gsap.to('.fate-mark', { opacity: 0.8, y: -10, duration: 1.5, stagger: 0.3, ease: "power2.out", delay: 0.5 });
        }

        async function enterRealm(id) {
            const track = document.getElementById('infiniteTrack');
            track.innerHTML = '<div class="content-card" style="writing-mode:horizontal-tb;">正在调取云端经卷...</div>';
            document.getElementById('voidRealm').classList.add('active');

            try {
                const { data, error } = await _supabase.from('posts').select('*').eq('target', id).order('created_at', { ascending: false }); 
                if (error) throw error;

                track.innerHTML = '';
                track.onwheel = (e) => { if(window.innerWidth > 768 && e.deltaY!==0) { e.preventDefault(); track.scrollLeft+=e.deltaY; } };

                data.forEach(item => {
                    let mdHtml = '';
                    if (typeof marked !== 'undefined') { mdHtml = marked.parse(item.body || ''); } 
                    else { mdHtml = (item.body || '').replace(/\n/g, '<br>'); }
                    
                    mdHtml = mdHtml.replace(/\b(\d{2,4})\b/g, '<span class="num-group">$1</span>');
                    
                    if (item.media) {
                        if(item.media.match(/\.(mp4|webm|mov)/i)) mdHtml += `<video src="${item.media}" controls playsinline></video>`;
                        else mdHtml += `<img src="${item.media}">`;
                    }

                    let colophonHtml = item.colophon ? `<div class="colophon-box">${item.colophon.replace(/\b(\d{2,4})\b/g, '<span class="num-group">$1</span>')}</div>` : '';
                    track.innerHTML += `<div class="content-card"><h2 class="article-title">${item.title}</h2><div class="article-body">${mdHtml}</div>${colophonHtml}</div>`;
                });

                const date = new Date().toLocaleDateString('zh-CN-u-ca-chinese');
                track.innerHTML += `<div class="content-card" style="text-align:center; padding:50px 0; border:none;"><div style="font-weight:bold; color:#999; letter-spacing:2px; display:inline-block;">${date}<br>道人 敬书<br><div style="width:30px; height:30px; border:1px solid #ccc; margin:20px auto 0; line-height:30px;">印</div></div></div>`;
            } catch (err) { 
                console.error(err);
                track.innerHTML = `<div class="content-card" style="writing-mode:horizontal-tb;">天机受阻：<br>国内节点连接异常，请重试。</div>`; 
            }
        }

        async function publish() {
            const title = document.getElementById('pTitle').value;
            if(!title) return alert("标题不能为空");
            try {
                const { error } = await _supabase.from('posts').insert([{
                    target: document.getElementById('pTarget').value, type: 'mixed', 
                    title: title, body: document.getElementById('pBody').value, media: '', colophon: document.getElementById('pColophon').value
                }]);
                if (error) throw error;
                alert("发布成功"); toggleAdmin();
                document.getElementById('pTitle').value = ""; document.getElementById('pBody').value = ""; document.getElementById('pColophon').value = "";
            } catch (err) { alert("发布失败：" + err.message); }
        }

        function toggleAdmin() { 
            if (!sessionStorage.getItem('dao_login')) {
                if (prompt("输入口令") !== 'tao') return alert("无缘");
                sessionStorage.setItem('dao_login', 'true');
            }
            document.getElementById('adminPanel').classList.toggle('open'); 
        }
        function closeRealm() { document.getElementById('voidRealm').classList.remove('active'); }

        window.onload = () => { generateFate(); };
    </script>
</body>
</html>
